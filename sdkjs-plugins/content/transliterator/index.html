<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Hello world</title>
        <script
            type="text/javascript"
            src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"
        ></script>
        <script
            type="text/javascript"
            src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"
        ></script>
        <link
            rel="stylesheet"
            href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css"
        />
        <link rel="stylesheet" href="resources/css/plugin_style.css" />
        <script type="text/javascript" src="scripts/translit.js"></script>
        <script type="text/javascript" src="scripts/plugin.js"></script>
    </head>
    <body>
        <div class="select-container">
            <label for="direction">Direction</label>
            <select id="direction">
                <option value="cyrillic-to-latin">Cyrillic → Latin</option>
                <option value="latin-to-cyrillic">Latin → Cyrillic</option>
                <option value="greek-to-latin">Greek → Latin</option>
            </select>
        </div>

        <div class="select-container">
            <label for="standard">Standard</label>
            <select id="standard"></select>
        </div>

        <p id="example">Example: Щукин → Shchukin</p>

        <div class="preview-container">
            <h3>Preview</h3>
            <div class="preview-wrapper">
                <div>
                    <h4 id="selected-label">Cyrillic</h4>
                    <pre id="selected-preview">
                        Select text
                    </pre>
                </div>
                <div>
                    <h4 id="transliterated-label">Latin</h4>
                    <pre id="transliterated-preview">Transliteration</pre>
                </div>
            </div>
            <hr />
        </div>
    </body>
</html>
