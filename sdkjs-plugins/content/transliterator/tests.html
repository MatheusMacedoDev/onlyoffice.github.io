<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transliterator Tests</title>
    <script type="text/javascript" src="scripts/translit.js"></script>
    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            color: #222;
            font: Arial, sans-serif;
        }

        main {
            width: 80%;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        p {
            color: #555;
            text-align: center;
        }

        .panel {
            background: #fff;
            border: 1px solid #ccc;
        }

        .summary {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .summary-item {
            border: 1px solid #ccc;
            background: #fafafa;
            text-align: center;
        }

        .summary-item strong {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            text-align: left;
            vertical-align: top;
        }

        .status {
            display: inline-block;
            font-weight: 700;
            text-align: center;
        }

        .status-pass {
            color: #0a6b2d;
            background: #e7f6eb;
        }

        .status-fail {
            color: #a12622;
            background: #fdecea;
        }

        code {
            font-family: Consolas, "Courier New", monospace;
        }
    </style>
</head>
<body>
    <main>
        <h1>Transliterator Unit Tests</h1>
        <p>This page runs explicit transliteration examples with fixed expected results. Reload it to rerun the tests.</p>

        <section class="panel">
            <div class="summary" id="summary"></div>
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Name</th>
                        <th>Input</th>
                        <th>Expected</th>
                        <th>Actual</th>
                    </tr>
                </thead>
                <tbody id="results"></tbody>
            </table>
        </section>
    </main>

    <script type="text/javascript">
    (function() {
        "use strict";

        var TEST_CASES = [
            { name: "ICAO lowercase", table: "icao", direction: "forward", input: "ж", expected: "zh" },
            { name: "ICAO title case", table: "icao", direction: "forward", input: "Жук", expected: "Zhuk" },
            { name: "ICAO uppercase", table: "icao", direction: "forward", input: "ЖУК", expected: "ZHUK" },
            { name: "GOST forward lowercase", table: "gost779b", direction: "forward", input: "щука", expected: "shhuka" },
            { name: "GOST forward title case", table: "gost779b", direction: "forward", input: "Щука", expected: "Shhuka" },
            { name: "GOST forward uppercase", table: "gost779b", direction: "forward", input: "ЩУКА", expected: "SHHUKA" },
            { name: "GOST reverse lowercase", table: "gost779b", direction: "reverse", input: "shhuka", expected: "щука" },
            { name: "GOST reverse title case", table: "gost779b", direction: "reverse", input: "Shhuka", expected: "Щука" },
            { name: "GOST reverse uppercase", table: "gost779b", direction: "reverse", input: "SHHUKA", expected: "ЩУКА" },
            { name: "ISO 9 forward lowercase", table: "iso9", direction: "forward", input: "щука", expected: "ŝuka" },
            { name: "ISO 9 forward title case", table: "iso9", direction: "forward", input: "Щука", expected: "Ŝuka" },
            { name: "ISO 9 forward uppercase", table: "iso9", direction: "forward", input: "ЩУКА", expected: "ŜUKA" },
            { name: "ISO 9 reverse lowercase", table: "iso9", direction: "reverse", input: "ŝuka", expected: "щука" },
            { name: "ISO 9 reverse title case", table: "iso9", direction: "reverse", input: "Ŝuka", expected: "Щука" },
            { name: "ISO 9 reverse uppercase", table: "iso9", direction: "reverse", input: "ŜUKA", expected: "ЩУКА" },
            { name: "ELOT forward lowercase", table: "elot743", direction: "forward", input: "θα", expected: "tha" },
            { name: "ELOT forward title case", table: "elot743", direction: "forward", input: "Θα", expected: "Tha" },
            { name: "ELOT forward uppercase", table: "elot743", direction: "forward", input: "ΘΑ", expected: "THA" },
            { name: "ELOT reverse lowercase", table: "elot743", direction: "reverse", input: "tha", expected: "θα" },
            { name: "ELOT reverse title case", table: "elot743", direction: "reverse", input: "Tha", expected: "Θα" },
            { name: "ELOT reverse uppercase", table: "elot743", direction: "reverse", input: "THA", expected: "ΘΑ" },

            { name: "ICAO Russian pangram", table: "icao", direction: "forward", input: "Съешь же ещё этих мягких французских булок да выпей чаю.", expected: "Sieesh zhe eshche etikh miagkikh frantsuzskikh bulok da vypei chaiu." },
            { name: "GOST Russian pangram", table: "gost779b", direction: "forward", input: "Съешь же ещё этих мягких французских булок да выпей чаю.", expected: "S``esh` zhe eshhyo e`tix myagkix franczuzskix bulok da vy`pej chayu." },
            { name: "ISO 9 Russian pangram", table: "iso9", direction: "forward", input: "Съешь же ещё этих мягких французских булок да выпей чаю.", expected: "Sʺešʹ že eŝë ètih mâgkih francuzskih bulok da vypej čaû." },
            { name: "ELOT Greek pangram", table: "elot743", direction: "forward", input: "διαφυλάξτε γενικά τη ζωή σας από βαθειά ψυχικά τραύματα", expected: "diafyláxte geniká ti zoí sas apó vatheiá psychiká trávmata" },

            { name: "ELOT tonos vowels lowercase", table: "elot743", direction: "forward", input: "ά έ ή ί ό ύ ώ", expected: "á é í í ó ý ó" },
            { name: "ELOT tonos vowels uppercase", table: "elot743", direction: "forward", input: "Ά Έ Ή Ί Ό Ύ Ώ", expected: "Á É Í Í Ó Ý Ó" },
            { name: "ELOT diaeresis and tonos", table: "elot743", direction: "forward", input: "ϊ Ϊ ϋ Ϋ ΐ ΰ", expected: "ï Ï ÿ Ÿ ḯ ÿ\u0301" },
            { name: "ELOT composed and decomposed accents", table: "elot743", direction: "forward", input: "ά α\u0301 ΐ ι\u0308\u0301", expected: "á á ḯ ḯ" },
            { name: "ELOT accented diphthongs", table: "elot743", direction: "forward", input: "αύριο | άυριο | ευχή | ηύρα", expected: "ávrio | áyrio | efchí | ívra" },
            { name: "ELOT uppercase and title-case accents", table: "elot743", direction: "forward", input: "ΑΎΡΙΟ | Αύριο | αΰ", expected: "ÁVRIO | Ávrio | aÿ\u0301" },
            { name: "ELOT polytonic vowels", table: "elot743", direction: "forward", input: "ἄ ἔ ὴ ἴ ὄ ὔ ὦ", expected: "á é í í ó ý ó" },

            { name: "GOST forward longest Cyrillic match", table: "gost779b", direction: "forward", input: "Цы", expected: "Cy" },
            { name: "GOST reverse longest Latin match", table: "gost779b", direction: "reverse", input: "cy", expected: "цы" },
            { name: "ELOT forward longest Greek match", table: "elot743", direction: "forward", input: "γγα", expected: "nga" },
            { name: "ELOT reverse longest Latin match", table: "elot743", direction: "reverse", input: "ng", expected: "γγ" },

            { name: "Passport name acceptance case", table: "icao", direction: "forward", input: "Щукин Юрий", expected: "Shchukin Iurii" },
            { name: "GOST lowercase щука acceptance case", table: "gost779b", direction: "forward", input: "щука", expected: "shhuka" },
            { name: "ISO 9 lowercase щука acceptance case", table: "iso9", direction: "forward", input: "щука", expected: "ŝuka" },
            { name: "GOST reverse shhuka acceptance case", table: "gost779b", direction: "reverse", input: "shhuka", expected: "щука" },
            { name: "ICAO Replace sentence acceptance case", table: "icao", direction: "forward", input: "Москва, ул. Щербакова 7", expected: "Moskva, ul. Shcherbakova 7" },
            { name: "GOST Russian ci reverse mapping", table: "gost779b", direction: "reverse", input: "ci", expected: "ци" },
            { name: "GOST title-case Ci reverse mapping", table: "gost779b", direction: "reverse", input: "Ci", expected: "Ци" },
            { name: "GOST uppercase CYO reverse mapping", table: "gost779b", direction: "reverse", input: "CYO", expected: "ЦЁ" },
            { name: "GOST uppercase ЦИ mapping", table: "gost779b", direction: "forward", input: "ЦИ", expected: "CI" },
            { name: "GOST uppercase ЦЁ mapping", table: "gost779b", direction: "forward", input: "ЦЁ", expected: "CYO" },
            { name: "GOST lowercase Цэ mapping", table: "gost779b", direction: "forward", input: "цэ", expected: "ce`" },
            { name: "GOST title-case Цэ mapping", table: "gost779b", direction: "forward", input: "Цэ", expected: "Ce`" },
            { name: "GOST uppercase ЦЭ mapping", table: "gost779b", direction: "forward", input: "ЦЭ", expected: "CE`" },
            { name: "GOST lowercase Цэ reverse mapping", table: "gost779b", direction: "reverse", input: "ce`", expected: "цэ" },
            { name: "GOST title-case Цэ reverse mapping", table: "gost779b", direction: "reverse", input: "Ce`", expected: "Цэ" },
            { name: "GOST uppercase Цэ reverse mapping", table: "gost779b", direction: "reverse", input: "CE`", expected: "ЦЭ" },
            { name: "GOST lowercase ѵ mapping", table: "gost779b", direction: "forward", input: "ѵ", expected: "yh" },
            { name: "GOST uppercase Ѵ mapping", table: "gost779b", direction: "forward", input: "Ѵ", expected: "YH" },
            { name: "GOST lowercase yh reverse mapping", table: "gost779b", direction: "reverse", input: "yh", expected: "ѵ" },
            { name: "GOST title-case Yh reverse mapping", table: "gost779b", direction: "reverse", input: "Yh", expected: "Ѵ" },
            { name: "GOST uppercase YH reverse mapping", table: "gost779b", direction: "reverse", input: "YH", expected: "Ѵ" }
        ];

        function runTest(testCase) {
            var actual = window.Transliterator.transliterate(
                testCase.input,
                testCase.table,
                testCase.direction
            );

            return {
                name: testCase.name,
                input: testCase.input || "-",
                expected: testCase.expected,
                actual: actual,
                passed: actual === testCase.expected
            };
        }

        function renderSummary(results) {
            var summary = document.getElementById("summary");
            var passed = results.filter(function(result) {
                return result.passed;
            }).length;
            var failed = results.length - passed;

            summary.innerHTML = [
                ["Total", results.length],
                ["Passed", passed],
                ["Failed", failed]
            ].map(function(item) {
                return "<div class=\"summary-item\"><span>" + item[0] + "</span><strong>" + item[1] + "</strong></div>";
            }).join("");
        }

        function renderResults(results) {
            var tbody = document.getElementById("results");

            tbody.innerHTML = results.map(function(result) {
                var statusClass = result.passed ? "status-pass" : "status-fail";
                var statusText = result.passed ? "PASS" : "FAIL";

                return [
                    "<tr>",
                    "<td><span class=\"status ", statusClass, "\">", statusText, "</span></td>",
                    "<td>", result.name, "</td>",
                    "<td><code>", String(result.input), "</code></td>",
                    "<td><code>", String(result.expected), "</code></td>",
                    "<td><code>", String(result.actual), "</code></td>",
                    "</tr>"
                ].join("");
            }).join("");
        }

        window.Transliterator.load().then(function() {
            var testResults = TEST_CASES.map(runTest);
            renderSummary(testResults);
            renderResults(testResults);
        }).catch(function(error) {
            document.getElementById("summary").innerHTML = "<div class=\"summary-item\"><span>Error</span><strong>Load failed</strong></div>";
            document.getElementById("results").innerHTML = "<tr><td colspan=\"5\"><code>" + String(error) + "</code></td></tr>";
        });
    })();
    </script>
</body>
</html>
