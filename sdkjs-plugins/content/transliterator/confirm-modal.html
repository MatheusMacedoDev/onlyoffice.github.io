<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Transliterator</title>
        <script
            type="text/javascript"
            src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"
        ></script>
        <script
            type="text/javascript"
            src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"
        ></script>
        <link
            rel="stylesheet"
            href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css"
        />
        <style>
            body {
                height: 90vh;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #message {
                font-size: 12px;
                line-height: 14px;
            }
        </style>
    </head>
    <body>
        <div id="message"></div>
        <script type="text/javascript">
            function renderMessage() {
                const count = new URLSearchParams(window.location.search).get(
                    "count",
                );
                const plugin = window.Asc && window.Asc.plugin;
                const key = "This will change {count} cells. Continue?";
                const translated =
                    plugin && typeof plugin.tr === "function"
                        ? plugin.tr(key)
                        : "";
                const message =
                    typeof translated === "string" && translated
                        ? translated
                        : key;

                document.getElementById("message").innerText = message
                    .split("{count}")
                    .join(String(count));
            }

            window.Asc.plugin.init = renderMessage;
            window.Asc.plugin.onTranslate = renderMessage;
        </script>
    </body>
</html>
